name: macOS release

# Builds YggApp for macOS, signs it with Developer ID, notarizes and staples it,
# and uploads the DMG. Pushing a tag like v0.1.0 also publishes a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 0.1.0)
        required: true
        default: "0.1.0"

jobs:
  build:
    runs-on: macos-26  # Xcode 26.x: apps built with an older SDK get the legacy look on current macOS
    permissions:
      contents: write   # to create the GitHub release on tags
    env:
      # Build numbers must keep increasing: macOS only replaces the system
      # extension when its CFBundleVersion changes.
      BUILD_NUMBER: ${{ github.run_number }}0
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          go-version-file: yggkit/go.mod
          cache-dependency-path: yggkit/go.sum

      - name: Install gomobile and XcodeGen
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init
          brew install xcodegen

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Import signing certificate and profiles
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          PROFILE_APP_B64: ${{ secrets.MACOS_PROFILE_APP }}
          PROFILE_TUNNEL_B64: ${{ secrets.MACOS_PROFILE_TUNNEL }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          echo "$PROFILE_APP_B64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          echo "$PROFILE_TUNNEL_B64" | base64 --decode > "$RUNNER_TEMP/tunnel.provisionprofile"
          {
            echo "KEYCHAIN=$KEYCHAIN"
            echo "PROFILE_APP=$RUNNER_TEMP/app.provisionprofile"
            echo "PROFILE_TUNNEL=$RUNNER_TEMP/tunnel.provisionprofile"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: release/release-macos.sh

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/release/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: YggApp-${{ env.VERSION }}
          path: build/release/YggApp-${{ env.VERSION }}.dmg
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-runnable: if the release already exists, replace the DMG.
        run: |
          DMG="build/release/YggApp-$VERSION.dmg"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" --title "YggApp $VERSION" --generate-notes
          fi

      # Point prietus/homebrew-tap's Casks/yggapp.rb at this release, so
      # `brew upgrade --cask yggapp` picks it up. Needs HOMEBREW_TAP_TOKEN: a
      # fine-grained token with Contents read/write on prietus/homebrew-tap.
      # The cask is rendered from release/yggapp.rb.in, so the first run
      # creates it. Skips cleanly when the secret isn't set.
      - name: Update Homebrew cask
        if: github.ref_type == 'tag' && env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA256=$(shasum -a 256 "build/release/YggApp-$VERSION.dmg" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" release/yggapp.rb.in > "$RUNNER_TEMP/yggapp.rb"
          API=repos/prietus/homebrew-tap/contents/Casks/yggapp.rb
          BLOB=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$BLOB" ] && gh api "$API" --jq .content | base64 --decode | cmp -s - "$RUNNER_TEMP/yggapp.rb"; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          gh api -X PUT "$API" \
            -f message="yggapp $VERSION" \
            -f content="$(base64 -i "$RUNNER_TEMP/yggapp.rb")" \
            ${BLOB:+-f sha="$BLOB"} --jq '.commit.html_url'

      - name: Remove signing keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
