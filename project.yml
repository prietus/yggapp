name: YggApp
options:
  bundleIdPrefix: com.prietus
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: LFTD9T269J
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  YggApp:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: YggApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Yggdrasil services are plain http:// on IPv6 literals (crypto is in the overlay).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/YggApp.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.prietus.yggapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prietus.yggapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnel
      - target: YggWidgets
    scheme:
      testTargets: [YggAppTests]
  YggAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"  # XCTest itself requires iOS 17
    sources:
      - Tests
    dependencies:
      - target: YggApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.prietus.yggapp.tests
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel, Shared]
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: YggApp Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.prietus.yggapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prietus.yggapp.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        OTHER_LDFLAGS: [-lresolv]
    dependencies:
      - framework: Frameworks/Yggkit.xcframework
        embed: false
  YggWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"  # ControlWidget
    sources:
      - Widgets
      - Shared/Shared.swift
      - Shared/VPNControl.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: YggApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/YggWidgets.entitlements
      properties:
        # Needed to load/start/stop the VPN profile from the widget process.
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.prietus.yggapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prietus.yggapp.widget

  # ---------------------------------------------------------------- macOS
  YggAppMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Mac
      - App/TunnelManager.swift
      - App/ContentView.swift
      - App/PublicPeers.swift
      - App/PublicPeersView.swift
      - App/DirectorySync.swift
      - App/DNSProbe.swift
      - App/PlatformViews.swift
      - Shared/Shared.swift
      - Shared/VPNControl.swift
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: YggApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true  # menu bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.utilities
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Mac/YggAppMac.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.developer.system-extension.install: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.prietus.yggapp]
    settings:
      base:
        PRODUCT_NAME: YggApp
        PRODUCT_BUNDLE_IDENTIFIER: com.prietus.yggapp.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: YggTunnelMac
  YggTunnelMac:
    type: system-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MacTunnel
      - PacketTunnel/PacketTunnelProvider.swift
      - PacketTunnel/NodeKeychain.swift
      - PacketTunnel/utun.c
      - Shared/Shared.swift
    info:
      path: MacTunnel/Info.plist
      properties:
        CFBundleDisplayName: YggApp Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: SYSX
        NSSystemExtensionUsageDescription: YggApp uses a network extension to connect your Mac to the Yggdrasil network.
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)com.prietus.yggapp.mac.tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: MacTunnel/YggTunnelMac.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # NE system extensions must vend their Mach service under an app group.
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.prietus.yggapp]
    settings:
      base:
        PRODUCT_NAME: com.prietus.yggapp.mac.tunnel
        PRODUCT_MODULE_NAME: YggTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.prietus.yggapp.mac.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        OTHER_LDFLAGS: [-lresolv]
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - framework: Frameworks/Yggkit.xcframework
        embed: false
